version: 2

updates:
  #SmartMeter.Client dependencies
  - package-ecosystem: "nuget"
    directory: "/src/SmartMeter.Client"
    schedule:
      interval: "weekly"
      day: "tuesday"
    open-pull-requests-limit: 5

  #SmartMeter.Model dependencies
  - package-ecosystem: "nuget"
    directory: "/src/SmartMeter.Model"
    schedule:
      interval: "weekly"
      day: "tuesday"
    open-pull-requests-limit: 5

  #SmartMeter.Server dependencies
  - package-ecosystem: "nuget"
    directory: "/src/SmartMeter.Server"
    schedule:
      interval: "weekly"
      day: "tuesday"
    open-pull-requests-limit: 5

  #GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
    open-pull-requests-limit: 5