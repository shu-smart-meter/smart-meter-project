services:
    server:
        ports: !override
            - "5443:8443"
        volumes:
            - ${SMART_METER_TLS_CERTIFICATE:?Set SMART_METER_TLS_CERTIFICATE to the host PFX path}:/https/tls.pfx:ro
        environment:
            ASPNETCORE_URLS: https://+:8443
            ASPNETCORE_Kestrel__Certificates__Default__Path: /https/tls.pfx
            ASPNETCORE_Kestrel__Certificates__Default__Password: ${SMART_METER_TLS_CERTIFICATE_PASSWORD:?Set SMART_METER_TLS_CERTIFICATE_PASSWORD}
