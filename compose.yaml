name: smart-meter

services:
    server:
        build:
            context: .
            dockerfile: src/SmartMeter.Server/Dockerfile
        ports:
            - "5080:8080"
        restart: unless-stopped
        volumes:
            # data survives a container restart and a rebuild
            - smart-meter-data:/data
        environment:
            # storage lives on the named volume, outside the image
            Storage__Path: /data/readings.json
            Billing__UnitPricePerKwh: ${Billing__UnitPricePerKwh:-0.24}
            # local defaults enable meter and admin authentication
            SMART_METER_CLIENT_SECRET: ${SMART_METER_CLIENT_SECRET:-local-development-client-secret}
            SMART_METER_ADMIN_TOKEN: ${SMART_METER_ADMIN_TOKEN:-local-development-admin-token}
            SMART_METER_TOKEN_SECONDS: ${SMART_METER_TOKEN_SECONDS:-3600}

    grafana:
        image: grafana/grafana:latest
        ports:
            - "3000:3000"
        restart: unless-stopped
        depends_on:
            - server
        environment:
            GF_SECURITY_ADMIN_USER: admin
            GF_SECURITY_ADMIN_PASSWORD: admin
            GF_INSTALL_PLUGINS: yesoreyeram-infinity-datasource
            SMART_METER_ADMIN_TOKEN: ${SMART_METER_ADMIN_TOKEN:-local-development-admin-token}
        volumes:
            - grafana-data:/var/lib/grafana
            - ./Grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
            - ./Grafana/smart-meter-dashboard.json:/etc/grafana/dashboards/smart-meter-dashboard.json:ro
            - ./Grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
            - ./Grafana/smart-meter-comparison.json:/etc/grafana/dashboards/smart-meter-comparison.json:ro


volumes:
    smart-meter-data:
    grafana-data:
